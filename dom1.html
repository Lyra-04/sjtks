<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#e9e2ea">
<title>Blaise · 主页</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="stage-glow"></div>

<div id="phone" class="phone">
  <div id="statusbar" class="statusbar"></div>
  <div id="screen" class="screen">
    <div id="desktop" class="desktop"></div>
    <div id="home-indicator" class="home-indicator"><i></i></div>
  </div>

  <div id="app-layer" class="app-layer"></div>
  <div id="call-layer" class="call-layer"></div>
  <div id="banner-layer" class="banner-layer"></div>
  <div id="overlay-layer" class="overlay-layer"></div>
  <div id="lock-screen" class="lock-screen"></div>
  <div id="island" class="island"><span class="island-lens"></span><div class="island-content"></div></div>
</div>

<div id="toast-layer" class="toast-layer"></div>

<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/widgets.js"></script>
<script src="js/call.js"></script>
<script src="js/apps/chat.js"></script>
<script src="js/apps/mailbox.js"></script>
<script src="js/apps/moments.js"></script>
<script src="js/apps/settings.js"></script>
<script src="js/desktop.js"></script>
<script src="js/main.js"></script>


</body></html>
